services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    volumes:
      - ./backend:/app
      - ./generations:/app/generations
      - ./piper_models:/app/piper_models   # 👈 AQUÍ montamos los modelos de Piper
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  xtts-service:
    build:
      context: ./xtts-service
    ports:
      - "8001:8001"
    volumes:
      - ./xtts-service:/app
      - xtts-cache:/root/.local/share/tts
      - ./generations:/app/generations
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"

volumes:
  xtts-cache: